suite: Heimdall Secret
templates:
  - templates/secrets.yaml
set:
  jwtSecret: unit-test-jwt
  databaseUsername: unit-test-user
  databasePassword: unit-test-password
  apiKeySecret: unit-test-api-key
  adminPassword: unit-test-admin-password
tests:
  - it: renders the application Secret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-heimdall

  - it: stores string values under the keys consumed by the StatefulSet
    asserts:
      - equal:
          path: stringData.jwtSecret
          value: unit-test-jwt
      - equal:
          path: stringData.databaseUsername
          value: unit-test-user
      - equal:
          path: stringData.apiKeySecret
          value: unit-test-api-key
      - equal:
          path: stringData.adminPassword
          value: unit-test-admin-password

  - it: base64-encodes the database password
    asserts:
      - equal:
          path: data.databasePassword
          value: dW5pdC10ZXN0LXBhc3N3b3Jk

  - it: omits the chart-managed Secret in externally managed mode
    set:
      sops.enabled: true
    asserts:
      - hasDocuments:
          count: 0
